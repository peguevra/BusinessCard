<html>
<head>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<style>
body { font-family:sans-serif; background:#f2f2f2; margin:0; padding:10px; }
.card {
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
.card a {
  display:block;
  text-decoration:none;
  color:inherit;
}
.name { font-size:15px; font-weight:600; }
.date { font-size:15px; color:#666; margin-top:4px; }
</style>
<script>
let sortAsc = true;
function sortBy(type) {
  const container = document.getElementById('list');
  const cards = Array.from(container.children);
  cards.sort((a, b) => {
    const av = a.dataset[type];
    const bv = b.dataset[type];
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });
  sortAsc = !sortAsc;
  cards.forEach(c => container.appendChild(c));
}
</script>
</head>
<body>
<div style='display:flex; font-weight:600; margin-bottom:10px;'>
<div onclick="sortBy('name')" style='flex:1; cursor:pointer;'>Name</div>
<div onclick="sortBy('date')" style='width:120px; text-align:right; cursor:pointer;'>Date</div>
</div>
<div id='list'>
<div class='card' data-name='Name' data-date='No'>
